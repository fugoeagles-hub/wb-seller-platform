[project]
name = "postgres-rls-multitenant"
version = "0.1.0"
description = "Multi-tenant isolation with PostgreSQL row-level security and a permissions resolver"
requires-python = ">=3.11"
dependencies = ["psycopg[binary]>=3.1"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
